<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 1. GRADIENT: Füst szálak elhalványulása felfelé (Erősebb alfa, gyorsabb fading) -->
    <linearGradient id="smokeStrokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="currentColor" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="currentColor" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/> <!-- Teljesen eltűnik -->
    </linearGradient>

    <!-- 2. GRADIENT: Gomolygó füsttest elhalványulása felfelé -->
    <linearGradient id="smokePuffGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="currentColor" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="currentColor" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/> <!-- Teljesen eltűnik -->
    </linearGradient>

    <!-- 3. GRADIENT: Maszk elhalványulása (Fading Mask) -->
    <!-- Ez a maszk FEKETE felül és FEHÉR alul, így a fekete résznél lévő füstöt elhalványítja. -->
    <linearGradient id="maskFadingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>   <!-- FELÜL: Teljesen elrejti -->
      <stop offset="15%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="1"/>  <!-- ALUL: Teljesen mutatja -->
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- MASZK LÉTREHOZÁSA: A maszk alapja fehér (mindent mutat), -->
    <!-- és egy téglalap használja a gradienst a tetején, hogy elhalványítson. -->
    <mask id="smokeFadingMaskTop">
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" /> <!-- Mindent mutat -->
      <rect x="0" y="0" width="100" height="50" fill="url(#maskFadingGrad)" /> <!-- Fading rész -->
    </mask>

    <style>
      .pipe-stroke {
        fill: none;
        stroke: currentColor;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .pipe-inner {
        fill: none;
        stroke: currentColor;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Füst szálak stílusa */
      .smoke-trail {
        fill: none;
        stroke: url(#smokeStrokeGrad);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 60;
      }

      /* Gomolygó felhőtest stílusa */
      .smoke-cloud-body {
        fill: url(#smokePuffGrad);
      }

      /* Egyedi animációk a kazán szájából indulva */
      /* Minden animáció Y skálázása erősebb, hogy ne emelkedjenek túl magasra */
      .smoke-line-1 {
        stroke-width: 4.2;
        animation: smokeDriftA 3.8s cubic-bezier(0.35, 0, 0.25, 1) infinite;
        transform-origin: 28px 57px;
      }

      .smoke-line-2 {
        stroke-width: 4.6;
        animation: smokeDriftB 4.6s cubic-bezier(0.35, 0, 0.25, 1) infinite;
        animation-delay: -1.5s;
        transform-origin: 28px 57px;
      }

      .smoke-line-3 {
        stroke-width: 3.8;
        animation: smokeDriftC 4s cubic-bezier(0.35, 0, 0.25, 1) infinite;
        animation-delay: -2.5s;
        transform-origin: 28px 57px;
      }

      .smoke-line-4 {
        stroke-width: 3.2;
        animation: smokeDriftD 5s cubic-bezier(0.35, 0, 0.25, 1) infinite;
        animation-delay: -0.7s;
        transform-origin: 28px 57px;
      }

      .smoke-line-5 {
        stroke-width: 3.4;
        animation: smokeDriftA 4.1s cubic-bezier(0.35, 0, 0.25, 1) infinite;
        animation-delay: -3s;
        transform-origin: 28px 57px;
      }

      .smoke-cloud-1 {
        animation: smokePuffA 4s ease-in-out infinite;
        transform-origin: 28px 57px;
      }

      .smoke-cloud-2 {
        animation: smokePuffB 4.8s ease-in-out infinite;
        animation-delay: -2s;
        transform-origin: 28px 57px;
      }

      @keyframes smokeDriftA {
        0% {
          stroke-dashoffset: 60;
          transform: translate(0, 0) scaleY(0.65) skewX(0deg);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        50% {
          transform: translate(4px, -18px) scaleY(1.05) skewX(8deg);
          opacity: 0.6;
        }
        80% {
          transform: translate(-3px, -36px) scaleY(1.3) skewX(-7deg);
          opacity: 0.25;
        }
        100% {
          stroke-dashoffset: -55;
          transform: translate(5px, -45px) scaleY(1.45) skewX(10deg);
          opacity: 0; /* Teljesen eltűnik */
        }
      }

      @keyframes smokeDriftB {
        0% {
          stroke-dashoffset: 60;
          transform: translate(0, 0) scaleY(0.6) skewX(0deg);
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        55% {
          transform: translate(-5px, -20px) scaleY(1.1) skewX(-10deg);
          opacity: 0.65;
        }
        85% {
          transform: translate(4px, -38px) scaleY(1.35) skewX(7deg);
          opacity: 0.2;
        }
        100% {
          stroke-dashoffset: -55;
          transform: translate(-6px, -48px) scaleY(1.5) skewX(-12deg);
          opacity: 0; /* Teljesen eltűnik */
        }
      }

      @keyframes smokeDriftC {
        0% {
          stroke-dashoffset: 60;
          transform: translate(0, 0) scaleY(0.7);
          opacity: 0;
        }
        30% {
          opacity: 0.9;
        }
        60% {
          transform: translate(3px, -21px) scaleY(1.15) skewX(6deg);
          opacity: 0.5;
        }
        100% {
          stroke-dashoffset: -50;
          transform: translate(-4px, -40px) scaleY(1.4) skewX(-6deg);
          opacity: 0; /* Teljesen eltűnik */
        }
      }

      @keyframes smokeDriftD {
        0% {
          stroke-dashoffset: 60;
          transform: translate(0, 0) scaleY(0.55);
          opacity: 0;
        }
        25% {
          opacity: 0.85;
        }
        58% {
          transform: translate(-4px, -22px) scaleY(1.05) skewX(-7deg);
          opacity: 0.55;
        }
        100% {
          stroke-dashoffset: -50;
          transform: translate(4px, -42px) scaleY(1.5) skewX(10deg);
          opacity: 0; /* Teljesen eltűnik */
        }
      }

      @keyframes smokePuffA {
        0% {
          transform: translate(0, 0) scale(0.6);
          opacity: 0;
        }
        20% {
          opacity: 0.75;
        }
        55% {
          transform: translate(3px, -22px) scale(1.1) skewX(6deg);
          opacity: 0.35;
        }
        100% {
          transform: translate(-5px, -40px) scale(1.5) skewX(-9deg);
          opacity: 0; /* Teljesen eltűnik */
        }
      }

      @keyframes smokePuffB {
        0% {
          transform: translate(0, 0) scale(0.5);
          opacity: 0;
        }
        25% {
          opacity: 0.7;
        }
        60% {
          transform: translate(-4px, -24px) scale(1.15) skewX(-8deg);
          opacity: 0.3;
        }
        100% {
          transform: translate(5px, -42px) scale(1.6) skewX(11deg);
          opacity: 0; /* Teljesen eltűnik */
        }
      }
    </style>
  </defs>

  <g id="pipe-logo">
    <!-- ANIMÁLT SŰRŰ FÜST (Maszkolva: mind alul a kazán pereménél, mind felül az elhalványulásnál) -->
    <!-- A mask attribútum itt a FADING maszkot hívja, ami elrejti a füst tetejét. -->
    <g id="smoke-group" mask="url(#smokeFadingMaskTop)">
      <!-- Gomolygó áttetsző felhő háttér -->
      <path class="smoke-cloud-body smoke-cloud-1"
            d="M 22 56 C 14 42 32 30 22 16 C 14 4 36 0 28 -6 C 37 0 47 12 39 24 C 48 36 31 45 34 56 Z" />
      <path class="smoke-cloud-body smoke-cloud-2"
            d="M 26 56 C 36 43 19 32 30 16 C 38 4 17 0 28 -6 C 19 2 11 14 18 26 C 10 38 24 45 24 56 Z" />

      <!-- Sűrű hullámzó füstszálak -->
      <path class="smoke-trail smoke-line-4" 
            d="M 20 56 C 11 44 26 32 17 17 C 9 5 23 -3 15 -7" />

      <path class="smoke-trail smoke-line-1" 
            d="M 24 56 C 15 42 34 30 22 15 C 13 3 29 -4 20 -8" />

      <path class="smoke-trail smoke-line-2" 
            d="M 28 56 C 41 44 21 31 33 14 C 42 3 27 -4 35 -8" />

      <path class="smoke-trail smoke-line-3" 
            d="M 32 56 C 40 45 28 34 39 19 C 47 8 37 -1 43 -6" />

      <path class="smoke-trail smoke-line-5" 
            d="M 36 56 C 45 45 37 36 47 22 C 52 11 44 1 49 -4" />
    </g>

    <!-- VONALAS PIPA IKON -->
    <g id="pipe-icon-body">
      <!-- Kazán felső karimája / nyílása (pontosan a füst indulási vonala) -->
      <ellipse cx="28" cy="58" rx="18" ry="4.8" class="pipe-stroke" />

      <!-- Kazán külső íve + szár + szopóka -->
      <path class="pipe-stroke" 
            d="M 10 58 
               C 9 79 18 95 33 95 
               C 45 95 53 88 64 78 
               C 74 69 84 64 95 64 
               C 97.5 64 98 62.5 98 60 
               C 98 57.5 97.5 56 95 56 
               C 81 56 70 63 59 73 
               C 51 79 46 78 44 72 
               L 46 58" />

      <!-- Kazán belső stílusos íve -->
      <path class="pipe-inner" 
            d="M 15 65 C 16 82 23 88 31 88" />

      <!-- Szár gyűrű osztása -->
      <path class="pipe-inner" 
            d="M 66 71 L 70 78" />
    </g>
  </g>
</svg>
